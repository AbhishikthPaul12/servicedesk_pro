<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rd-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="rd-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Spine Gradient (Pillar) -->
    <linearGradient id="rd-spine-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Loop Gradient (Orbital Arc) -->
    <linearGradient id="rd-loop-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Wing / Kick Gradient (Thrust Arrow) -->
    <linearGradient id="rd-wing-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="rd-core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="rd-ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#rd-bg-grad)" stroke="url(#rd-border-grad)" stroke-width="2.5" />

  <!-- Ambient Internal Glow Sphere -->
  <circle cx="50" cy="50" r="26" fill="#2563eb" opacity="0.25" filter="url(#rd-ambient-glow)" />
  <circle cx="65" cy="65" r="16" fill="#10b981" opacity="0.22" filter="url(#rd-ambient-glow)" />

  <!-- ==================== "R" MONOGRAM EMBLEM ==================== -->
  <!-- 1. Left Foundation Pillar (Vertical Spine) -->
  <rect x="22" y="22" width="13" height="56" rx="6.5" fill="url(#rd-spine-grad)" />

  <!-- 2. Upper Vortex Loop -->
  <path
    d="M 28 28
       H 54
       C 69 28, 77 35, 77 44
       C 77 53, 69 60, 54 60
       H 30"
    fill="none"
    stroke="url(#rd-loop-grad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. Resolution Dynamic Thrust Wing (Lower Kick) -->
  <path
    d="M 45 52
       L 69 76"
    fill="none"
    stroke="url(#rd-wing-grad)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- 4. Inner Precision Spark / Resolution Nexus -->
  <path
    d="M 51 40
       Q 51 44 47 44
       Q 51 44 51 48
       Q 51 44 55 44
       Q 51 44 51 40 Z"
    fill="#ffffff"
    filter="url(#rd-core-glow)"
  />
  <circle cx="51" cy="44" r="1.5" fill="#ffffff" />
</svg>
